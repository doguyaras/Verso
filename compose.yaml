# Verso on one host (reference 18.2, ADR-0009). From a fresh clone:
#
#   bash scripts/dev-secrets.sh && docker compose up -d --build
#
# Non-secret settings: .env (template: .env.example). Secrets: secrets/ files mounted under /run/secrets (reference
# 15.3), never environment variables. Only the API is published, and only on 127.0.0.1; PostgreSQL and the actuator
# port stay inside the compose network.
name: verso

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-java-service-defaults: &java-service-defaults
  <<: *hardening
  restart: always
  # server.shutdown=graceful with 25s per phase (application.yml) + margin before SIGKILL.
  stop_grace_period: 35s
  mem_limit: ${VERSO_MEM_LIMIT:-1536m}
  cpus: ${VERSO_CPUS:-2}
  pids_limit: 512
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  tmpfs:
    - /tmp:size=256m

x-postgres-image: &postgres-image pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0

services:
  postgres:
    image: *postgres-image
    restart: always
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_BACKUP_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql
      # Roles, schemas, extensions and settings: run once, on an empty data volume.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verso -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  verso-app:
    <<: *java-service-defaults
    build: .
    image: verso:${VERSO_IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: verso
    secrets:
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
    ports:
      - "127.0.0.1:${VERSO_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Encrypted logical backups on a schedule (ADR-0009): pg_dump as verso_backup (pg_read_all_data), gpg AES256,
  # SHA-256 sum and a row-count manifest taken in the same snapshot. RPO = BACKUP_INTERVAL_SECONDS.
  backup:
    <<: *hardening
    image: *postgres-image
    restart: always
    entrypoint: ["bash", "/opt/verso/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGDATABASE: verso
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    secrets:
      - SECRET_DB_BACKUP_PASSWORD
      - SECRET_BACKUP_ENCRYPTION_KEY
    volumes:
      - ./deploy/backup:/opt/verso:ro
      - backups:/backups
    tmpfs:
      - /tmp:size=64m
    depends_on:
      postgres:
        condition: service_healthy

  # ----- restore drill (profile "drill", scripts/restore-drill.sh) -----
  # A throwaway PostgreSQL with roles only; the dump brings schemas, extensions, grants and data.
  restore-db:
    profiles: ["drill"]
    image: *postgres-image
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_BACKUP_PASSWORD
    volumes:
      - ./deploy/postgres/initdb/05-settings.sh:/docker-entrypoint-initdb.d/05-settings.sh:ro
      - ./deploy/postgres/initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs:
      - /var/lib/postgresql:size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verso -q"]
      interval: 3s
      timeout: 3s
      retries: 40

  restore-runner:
    profiles: ["drill"]
    <<: *hardening
    image: *postgres-image
    entrypoint: ["bash", "/opt/verso/restore-check.sh"]
    environment:
      PGHOST: restore-db
      PGDATABASE: verso
      BACKUP_DIR: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_BACKUP_ENCRYPTION_KEY
    volumes:
      - ./deploy/backup:/opt/verso:ro
      - backups:/backups:ro
    tmpfs:
      - /tmp:size=1g
    depends_on:
      restore-db:
        condition: service_healthy

  # Flyway validate against the restored database: the history must match the migrations of this checkout.
  restore-flyway:
    profiles: ["drill"]
    image: flyway/flyway:12.4.0@sha256:5be18367a9b3979a9f37234c371b80da457a448fb9577bd94d4bf24d923fafac
    # The password goes through FLYWAY_PASSWORD, never the argument list.
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$$(cat /run/secrets/SECRET_DB_DOCUMENT_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_document_migrate -schemas=document -defaultSchema=document -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true validate"]
    secrets:
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
    volumes:
      - ./services/document/document-core/src/main/resources/db/migration/document:/flyway/migrations:ro
    depends_on:
      restore-db:
        condition: service_healthy

secrets:
  SECRET_POSTGRES_SUPERUSER_PASSWORD:
    file: ./secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
  SECRET_DB_DOCUMENT_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
  SECRET_DB_DOCUMENT_PASSWORD:
    file: ./secrets/SECRET_DB_DOCUMENT_PASSWORD
  SECRET_DB_BACKUP_PASSWORD:
    file: ./secrets/SECRET_DB_BACKUP_PASSWORD
  SECRET_BACKUP_ENCRYPTION_KEY:
    file: ./secrets/SECRET_BACKUP_ENCRYPTION_KEY

volumes:
  pgdata:
  backups:
