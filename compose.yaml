# Verso on one host (reference 18.2, ADR-0009). From a fresh clone (repository root):
#
#   bash scripts/dev-secrets.sh && docker compose up -d --build --wait
#
# Non-secret settings: .env (template: .env.example). Secrets: secrets/ files mounted under /run/secrets (reference
# 15.3), never environment variables. Only the API (through the edge proxy) and the demo IdP are published, and only
# on 127.0.0.1; PostgreSQL and the actuator port stay inside the compose network. The application, the database and the
# model server sit on internal networks only: in local mode nothing of Verso has a route to the internet (ADR-0006,
# ADR-0013). Cloud mode: deploy/compose.cloud.yaml. The project name is fixed: a second checkout on the same host shares the
# containers and volumes unless COMPOSE_PROJECT_NAME is set.
name: verso

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-java-service-defaults: &java-service-defaults
  <<: *hardening
  # server.shutdown=graceful with 25s per phase (application.yml) + margin before SIGKILL.
  stop_grace_period: 35s
  mem_limit: ${VERSO_MEM_LIMIT:-1536m}
  cpus: ${VERSO_CPUS:-2}
  pids_limit: 512
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  tmpfs:
    - /tmp:size=256m

# Database and identity provider coordinates inside the compose network; every non-secret placeholder of
# config/verso.yml must be set here for both Java services (ComposeConfigTest).
x-db-env: &db-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: verso
  # Tokens carry the public issuer URL; the keys are fetched over the compose network (ADR-0010).
  OIDC_ISSUER: http://localhost:${VERSO_KEYCLOAK_PORT:-8180}/realms/verso
  OIDC_JWK_SET_URI: http://keycloak:8080/realms/verso/protocol/openid-connect/certs
  # Plain HTTP to a non-loopback host is refused unless allowed explicitly; here the hop never leaves the compose
  # network. A production IdP is fetched over https and keeps the default (false).
  OIDC_JWKS_ALLOW_HTTP: "true"
  # Where the bundled Keycloak puts roles and groups in the access token (ADR-0019).
  OIDC_ROLES_CLAIM: realm_access.roles
  OIDC_CLIENT_ROLES_CLAIM: ""
  OIDC_GROUPS_CLAIM: groups
  # Microsoft Entra ID as a second trusted issuer (ADR-0041, docs/entra-kurulumu.md); off while the tenant id is empty.
  # Its keys live on the internet: in local mode set OIDC_ENTRA_JWK_SET_URI to a mirror on the internal network.
  OIDC_ENTRA_TENANT_ID: ${OIDC_ENTRA_TENANT_ID:-}
  OIDC_ENTRA_AUTHORITY: ${OIDC_ENTRA_AUTHORITY:-https://login.microsoftonline.com}
  OIDC_ENTRA_JWK_SET_URI: ${OIDC_ENTRA_JWK_SET_URI:-}
  OIDC_ENTRA_AUDIENCES: ${OIDC_ENTRA_AUDIENCES:-}
  OIDC_ENTRA_MCP_AUDIENCES: ${OIDC_ENTRA_MCP_AUDIENCES:-}
  # Embeddings from the local Ollama (ADR-0006, ADR-0011); the model name is the one ollama-pull fetched.
  OLLAMA_BASE_URL: http://ollama:11434
  # The local chat model has an Ollama of its own (ADR-0062): a stuck generation cannot stop the embeddings.
  OLLAMA_CHAT_BASE_URL: http://ollama-chat:11434
  OLLAMA_EMBEDDING_MODEL: &embedding-model bge-m3:567m
  # The local chat model (ADR-0006). VERSO_CHAT_MODEL and its digest can name another one (CI uses a small model).
  OLLAMA_CHAT_MODEL: ${VERSO_CHAT_MODEL:-gemma4:e2b}
  # Local mode, fixed here: only the cloud overlay switches it, together with the network and the key (ADR-0013).
  VERSO_AI_MODE: local
  VERSO_CHAT_PROVIDER: ollama
  # Read in cloud mode (deploy/compose.cloud.yaml) or with the shared-tier model server (deploy/compose.llamacpp.yaml).
  CLOUD_CHAT_MODEL: ${VERSO_CLOUD_CHAT_MODEL:-claude-sonnet-5-5}
  OPENAI_BASE_URL: ${VERSO_OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_CHAT_TIMEOUT: 30s
  # Chat calls in flight per instance (ADR-0008, ADR-0051): no more than the model server answers at once.
  VERSO_QA_CHAT_CONCURRENCY: ${VERSO_QA_CHAT_CONCURRENCY:-1}
  # Conversation history retention and the unanswered-questions policy (ADR-0023); the data controller decides.
  VERSO_HISTORY_RETENTION_DAYS: ${VERSO_HISTORY_RETENTION_DAYS:-90}
  VERSO_SHOW_UNANSWERED_QUESTIONS: ${VERSO_SHOW_UNANSWERED_QUESTIONS:-false}
  VERSO_SHOW_DOCUMENT_NAMES: ${VERSO_SHOW_DOCUMENT_NAMES:-false}
  # How long audit rows are kept, in days (ADR-0026; KVKK storage limitation, the data controller decides, 30-3650).
  VERSO_AUDIT_RETENTION_DAYS: ${VERSO_AUDIT_RETENTION_DAYS:-365}
  # Follow-up questions rewritten with the conversation before the search (ADR-0046); false: searched as asked.
  VERSO_QA_FOLLOWUP_ENABLED: ${VERSO_QA_FOLLOWUP_ENABLED:-true}
  # Cited sentences whose numbers or codes the cited passage does not give are listed as unverified (ADR-0047).
  VERSO_QA_GROUNDING_ENABLED: ${VERSO_QA_GROUNDING_ENABLED:-true}
  # A model refusal, or an answer that does not give what the question asks for, is "not found" (ADR-0064).
  VERSO_QA_RELEVANCE_ENABLED: ${VERSO_QA_RELEVANCE_ENABLED:-true}
  # Questions matching an expert-verified answer card are answered with it (ADR-0049); two-person rule optional.
  VERSO_QA_KNOWLEDGE_ENABLED: ${VERSO_QA_KNOWLEDGE_ENABLED:-true}
  VERSO_QA_KNOWLEDGE_TWO_PERSON_RULE: ${VERSO_QA_KNOWLEDGE_TWO_PERSON_RULE:-false}
  # An approved procedure matching the question is shown above the answer (ADR-0053); off until measured.
  VERSO_QA_SKILLS_SERVING_ENABLED: ${VERSO_QA_SKILLS_SERVING_ENABLED:-false}
  # System model (ADR-0054): retrieval enrichment and the local-model suggestion pass; both off until measured.
  VERSO_DOCUMENT_SYSTEM_MODEL_ENRICHMENT_ENABLED: ${VERSO_DOCUMENT_SYSTEM_MODEL_ENRICHMENT_ENABLED:-false}
  VERSO_QA_SYSTEM_MODEL_SUGGESTIONS_ENABLED: ${VERSO_QA_SYSTEM_MODEL_SUGGESTIONS_ENABLED:-false}
  # Multi-step reasoning (ADR-0055): comparison questions split into at most 3 sub-questions; off until measured.
  VERSO_QA_REASONING_ENABLED: ${VERSO_QA_REASONING_ENABLED:-false}
  # The docling sidecar (ADR-0032) is off here; deploy/compose.docling.yaml adds it and switches it on.
  VERSO_DOCLING_ENABLED: "false"
  VERSO_DOCLING_URL: http://docling:5001
  # The reranker sidecar (ADR-0043) is off here; deploy/compose.reranker.yaml adds it and switches it on (GPU installs).
  VERSO_RERANKER_ENABLED: "false"
  VERSO_RERANKER_URL: http://reranker:80
  # Read-only MCP server (ADR-0031), off by default; the same variable picks the edge's /mcp route file below.
  VERSO_MCP_ENABLED: ${VERSO_MCP_ENABLED:-false}
  VERSO_MCP_RESOURCE: ${VERSO_MCP_RESOURCE:-http://localhost:8080/mcp}
  VERSO_MCP_SHOW_DOCUMENT_NAMES: ${VERSO_MCP_SHOW_DOCUMENT_NAMES:-true}
  # The process role (ADR-0039): true runs the ingestion worker in this process (the only process today).
  VERSO_INGESTION_ENABLED: ${VERSO_INGESTION_ENABLED:-true}
  # Internal networks the SMB connector may reach (ADR-0038), CIDR, private ranges only; empty: none. The application
  # has no route to them in this file: deploy/compose.smb.yaml adds the network and the service account secret.
  VERSO_CONNECTOR_ALLOWED_NETWORKS: ${VERSO_CONNECTOR_ALLOWED_NETWORKS:-}
  # Internet egress of connectors (ADR-0044, Confluence Cloud): off; local mode (strict) refuses it at start-up.
  VERSO_CONNECTOR_EXTERNAL_EGRESS: ${VERSO_CONNECTOR_EXTERNAL_EGRESS:-false}
  VERSO_CONNECTOR_EXTERNAL_HOSTS: ${VERSO_CONNECTOR_EXTERNAL_HOSTS:-}

x-ollama-image: &ollama-image ollama/ollama:0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35

x-postgres-image: &postgres-image pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0

services:
  postgres:
    image: *postgres-image
    restart: always
    # Not read_only/cap_drop: the official entrypoint needs root to prepare PGDATA before dropping to postgres.
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 512
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_QA_MIGRATE_PASSWORD
      - SECRET_DB_QA_PASSWORD
      - SECRET_DB_AUDIT_MIGRATE_PASSWORD
      - SECRET_DB_AUDIT_PASSWORD
      - SECRET_DB_CONNECTOR_MIGRATE_PASSWORD
      - SECRET_DB_CONNECTOR_PASSWORD
      - SECRET_DB_WORK_MIGRATE_PASSWORD
      - SECRET_DB_WORK_PASSWORD
      - SECRET_DB_BACKUP_PASSWORD
      - SECRET_DB_KEYCLOAK_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql
      # Roles, schemas, extensions and settings: run once, on an empty data volume.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    stop_grace_period: 60s
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verso -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # One-shot migration with the application image (ADR-0009, review S4): only this container holds the migration
  # roles' passwords. It runs Flyway for every module schema (document, qa, audit, connector, work; ADR-0023, ADR-0026, ADR-0038, ADR-0057) without a web server and
  # without the application DataSource, then exits.
  migrate:
    <<: *java-service-defaults
    image: verso:${VERSO_IMAGE_TAG:-local}
    # Built by verso-app (same image); never pulled.
    pull_policy: never
    restart: "no"
    mem_limit: 512m
    command:
      - --spring.main.web-application-type=none
      # Boot's DataSource and Flyway auto-configuration are excluded for every run (application.yml, ADR-0039). No
      # application connection here: the document pool is switched off, the qa and audit pools are web-only.
      - --verso.document.datasource.enabled=false
      # No DataSource, so no "db" health contributor for the readiness group; there is no web server to ask anyway.
      - --management.endpoint.health.validate-group-membership=false
      # No model client either (ADR-0011): the document and qa modules are not loaded without a web server.
      - --spring.ai.model.embedding=none
      - --spring.ai.model.chat=none
    environment:
      <<: *db-env
    secrets:
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_QA_MIGRATE_PASSWORD
      - SECRET_DB_AUDIT_MIGRATE_PASSWORD
      - SECRET_DB_CONNECTOR_MIGRATE_PASSWORD
      - SECRET_DB_WORK_MIGRATE_PASSWORD
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  verso-app:
    <<: *java-service-defaults
    build: .
    image: verso:${VERSO_IMAGE_TAG:-local}
    restart: always
    environment:
      <<: *db-env
      # Migrations ran in "migrate": the long-running application cannot run DDL or rewrite the Flyway history.
      SPRING_FLYWAY_ENABLED: "false"
    secrets:
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_QA_PASSWORD
      - SECRET_DB_AUDIT_PASSWORD
      - SECRET_DB_CONNECTOR_PASSWORD
      - SECRET_DB_WORK_PASSWORD
      # The model gateway's key-encryption key (ADR-0056): wraps the provider API keys stored in the qa schema; the
      # config tree turns the file into the setting of the same name (no placeholder, no fallback).
      - SECRET_MODEL_GATEWAY_KEK
    # Not published: the edge proxy is the way in (ADR-0013).
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not depending on ollama on purpose (review E1): uploads are accepted while the model is down or still being
    # pulled; the worker pauses and catches up (ADR-0011).
    # Internal networks only: no route to the internet (ADR-0006 decision 1.1). The cloud overlay adds "egress".
    networks: [backend, models]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Demo identity provider (ADR-0005, ADR-0010): realm "verso" with ES256 tokens, its own database "keycloak". Published
  # on 127.0.0.1 for the device-flow login and the CI smoke token; production uses the customer's IdP instead.
  # Not read_only: Keycloak builds its optimised server and writes caches under /opt/keycloak at startup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}
    pids_limit: 512
    entrypoint: ["bash", "/opt/verso/start.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Fixed frontend URL: every token says iss=http://localhost:<port>/realms/verso, whichever address fetched it.
      KC_HOSTNAME: http://localhost:${VERSO_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Plain HTTP only on 127.0.0.1 and inside the compose network; a TLS reverse proxy sits in front in production.
      KC_HTTP_ENABLED: "true"
    secrets:
      - SECRET_DB_KEYCLOAK_PASSWORD
      - SECRET_KEYCLOAK_ADMIN_PASSWORD
      - SECRET_KEYCLOAK_CI_CLIENT_SECRET
      - SECRET_KEYCLOAK_DEMO_USER_PASSWORD
      - SECRET_KEYCLOAK_PANEL_ADMIN_PASSWORD
    volumes:
      - ./deploy/keycloak/start.sh:/opt/verso/start.sh:ro
      - ./deploy/keycloak/realm:/opt/keycloak/data/import:ro
      # Verso login theme (ADR-0017): markup and CSS only, read-only.
      - ./deploy/keycloak/themes/verso:/opt/keycloak/themes/verso:ro
    ports:
      - "127.0.0.1:${VERSO_KEYCLOAK_PORT:-8180}:8080"
    # default: the published port (device-flow login, CI token); backend: its database, and the application's key fetch.
    networks: [default, backend]
    depends_on:
      postgres:
        condition: service_healthy
    # No curl in the image: bash's /dev/tcp fetches the realm's discovery document. Not /health/ready: it answers UP
    # while the bootstrap (realm import) still runs in the background and token requests get 503 (observed: 8 s).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/verso/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"token_endpoint\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Model download and store upgrade, once (llm-rules 8.2, ADR-0033): a private Ollama server inside this container
  # pulls the models into the volume (the only writer) and checks the pinned layer digest (bge-m3:567m, MIT licence,
  # docs/versions.md). Ollama 0.40 keeps models in "manifests-v2/" and cannot start on a read-only volume that has
  # none, so a volume written by 0.35 is migrated here too: the pull reuses the blobs and only writes the v2 manifest.
  # Needs internet only when a model is not in the v2 store yet.
  ollama-pull:
    <<: *hardening
    image: *ollama-image
    restart: "no"
    entrypoint: ["sh", "/opt/verso/pull.sh"]
    mem_limit: 512m
    pids_limit: 256
    environment:
      # name@digest pairs: the embedding model, then the chat model (bge-m3 MIT, Gemma 4 Gemma terms; docs/versions.md).
      OLLAMA_PULL: >-
        bge-m3:567m@sha256:daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c
        ${VERSO_CHAT_MODEL:-gemma4:e2b}@${VERSO_CHAT_MODEL_DIGEST:-sha256:6dd7ac24fe13a238898e16e253ebc7a72fa27fb83f2658c2f6c241df3af5937d}
    volumes:
      - ollama-models:/root/.ollama
      - ./deploy/ollama/pull.sh:/opt/verso/pull.sh:ro
    tmpfs:
      - /tmp:size=64m

  # Local embedding model server (ADR-0006, ADR-0011). Only on the internal "models" network: no route to the internet
  # (llm-rules 8.2) and nobody but the application can reach it. It never pulls (ollama-pull did) and reads the models
  # read-only: the verified blobs and manifests cannot be changed from here. Ollama 0.40 starts on a read-only volume
  # only when the store is complete (manifests-v2 populated by ollama-pull; ADR-0033). The embedding model only
  # (ADR-0062): the chat model runs in "ollama-chat", so a stuck chat generation, its memory growth or its OOM kill
  # (2026-10-29: 4 minutes without one embedding) stays in that container.
  ollama:
    <<: *hardening
    image: *ollama-image
    restart: always
    # bge-m3 (1,16 GB) with its context and page cache; the chat model is no longer counted here.
    mem_limit: ${OLLAMA_MEM_LIMIT:-2g}
    cpus: ${OLLAMA_CPUS:-2}
    pids_limit: 512
    networks: [models]
    # Warms the model after every start (deploy/ollama/serve.sh): the first question must not pay the model load.
    entrypoint: ["bash", "/opt/verso/serve.sh"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # No ollama.com cloud models or remotes (llm-rules 1.1, 8.2).
      OLLAMA_NO_CLOUD: "true"
      # The model stays loaded for good: after 30 min idle the first question paid a 2-60 s reload and the 10 s
      # question-embedding budget failed (docs/capacity.md).
      OLLAMA_KEEP_ALIVE: "-1"
      # One model: a request for any other (a chat model by mistake) cannot evict the embedding model.
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Requests the model answers at once (ADR-0051): the same setting as the chat server, as before the split.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_WARM_EMBEDDING: bge-m3:567m
      OLLAMA_WARM_CHAT: none
    volumes:
      - ollama-models:/root/.ollama:ro
      - ./deploy/ollama/serve.sh:/opt/verso/serve.sh:ro
    tmpfs:
      - /tmp:size=256m
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      # Healthy means warm: the model is in memory, not only on disk.
      test: ["CMD-SHELL", "ollama ps | grep -q '^bge-m3:567m '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # Local chat model server (ADR-0006, ADR-0062): the same image, network, read-only model volume and hardening as
  # "ollama", a process and a memory limit of its own. Nothing it does (a stuck generation, KV and prompt-cache growth,
  # an OOM kill of its runner) reaches the embedding server. deploy/compose.llamacpp.yaml replaces it with llama-server.
  ollama-chat:
    <<: *hardening
    image: *ollama-image
    restart: always
    # gemma4:e2b (3,5 GB) with its KV cache and runtime; the runner's prompt cache is off below, so this bound holds.
    mem_limit: ${OLLAMA_CHAT_MEM_LIMIT:-5g}
    cpus: ${OLLAMA_CPUS:-2}
    pids_limit: 512
    networks: [models]
    entrypoint: ["bash", "/opt/verso/serve.sh"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Requests one model answers at once (ADR-0051): 1 by default, one answer at a time; a GPU host can raise it with
      # VERSO_QA_CHAT_CONCURRENCY. Every extra slot reserves KV cache (VRAM or RAM) for the chat model's context.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_WARM_EMBEDDING: none
      OLLAMA_WARM_CHAT: ${VERSO_CHAT_MODEL:-gemma4:e2b}
      # ADR-0062: Ollama starts llama.cpp's llama-server with this environment and passes neither setting, so the
      # runner kept up to 8 GiB of prompt cache and 32 context checkpoints per slot in host RAM (gemma's sliding-window
      # attention), above this container's limit; llama.cpp issues 21690, 22629, 24265. Every Verso prompt carries
      # other passages, so the cache saves little; off, the memory stays bounded.
      LLAMA_ARG_CACHE_RAM: "0"
      LLAMA_ARG_CTX_CHECKPOINTS: "0"
    volumes:
      - ollama-models:/root/.ollama:ro
      - ./deploy/ollama/serve.sh:/opt/verso/serve.sh:ro
    tmpfs:
      - /tmp:size=256m
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama ps | grep -q '^${VERSO_CHAT_MODEL:-gemma4:e2b} '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  # Encrypted logical backups on a schedule (ADR-0009): pg_dump as verso_backup (pg_read_all_data), gpg AES256,
  # SHA-256 sum, row-count manifest and privilege fingerprint taken in the same snapshot. RPO = BACKUP_INTERVAL_SECONDS.
  backup:
    <<: *hardening
    image: *postgres-image
    restart: always
    # tini as PID 1: "docker compose stop" ends the loop with SIGTERM instead of SIGKILL (review E9).
    init: true
    mem_limit: 512m
    pids_limit: 128
    entrypoint: ["bash", "/opt/verso/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGDATABASE: verso
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    secrets:
      - SECRET_DB_BACKUP_PASSWORD
      - SECRET_BACKUP_ENCRYPTION_KEY
    volumes:
      - ./deploy/backup:/opt/verso:ro
      - backups:/backups
    tmpfs:
      - /tmp:size=64m
    networks: [backend]
    # Healthy only while the last successful backup is younger than two intervals (+10 min): a failing backup is
    # visible in "docker compose ps", not only in the logs (review E7).
    healthcheck:
      test: ["CMD", "bash", "-c", "f=/backups/last-success; [ -s $$f ] && [ $$(( $$(date +%s) - $$(date -d \"$$(cat $$f)\" +%s) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS} * 2 + 600 )) ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  # Edge proxy (ADR-0013): the API's only published port. The application has no published port and no route out; this
  # container bridges 127.0.0.1:VERSO_HTTP_PORT to it and answers 503 in the common envelope while it is down.
  edge:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: always
    # The image's entrypoint scripts rewrite files under /etc/nginx; the configuration is mounted read-only instead.
    entrypoint: ["nginx", "-g", "daemon off;"]
    mem_limit: 64m
    pids_limit: 64
    networks: [default, backend]
    ports:
      - "127.0.0.1:${VERSO_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      # The mode on the proxy's own error responses; the cloud overlay mounts mode-cloud.conf.
      - ./deploy/edge/mode-local.conf:/etc/nginx/mode.conf:ro
      # Whether /mcp and its RFC 9728 metadata are routed (ADR-0031): mcp-false.conf or mcp-true.conf.
      - ./deploy/edge/mcp-${VERSO_MCP_ENABLED:-false}.conf:/etc/nginx/mcp.conf:ro
      # The panel (ADR-0015): static files, served at /panel/.
      - ./panel:/usr/share/verso-panel:ro
      # The installation's branding (ADR-0021): branding.json and its logo, served at /branding.json and /branding/.
      - ./deploy/branding:/usr/share/verso-branding:ro
    tmpfs:
      - /tmp:size=32m
    depends_on:
      verso-app:
        condition: service_healthy

  # ----- observability (profile "obs", ADR-0014): docker compose --profile obs up -d --wait -----
  # Metrics: Prometheus scrapes the management port, Alertmanager routes the five basic alerts. Logs: Alloy reads the
  # project's container logs (JSON) into Loki. Grafana shows both on 127.0.0.1:VERSO_GRAFANA_PORT. All of it on the
  # internal "obs" network (Prometheus also on "backend" to reach the application); only Grafana is published.
  prometheus:
    <<: *hardening
    profiles: ["obs"]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    mem_limit: 512m
    pids_limit: 128
    networks: [backend, obs]
    volumes:
      - ./deploy/obs/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # promtool's rule tests (scripts/obs-smoke.sh) need a scratch directory; the root file system is read-only.
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  alertmanager:
    <<: *hardening
    profiles: ["obs"]
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    restart: always
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    mem_limit: 64m
    pids_limit: 64
    networks: [obs]
    volumes:
      - ./deploy/obs/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

  loki:
    <<: *hardening
    profiles: ["obs"]
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: always
    command: ["-config.file=/etc/loki/loki.yml"]
    mem_limit: 512m
    pids_limit: 128
    networks: [obs]
    volumes:
      - ./deploy/obs/loki:/etc/loki:ro
      - loki-data:/loki
    tmpfs:
      - /tmp:size=64m

  # Reads container logs through the Docker socket (read-only mount; the socket still grants control of the Docker
  # daemon, so Alloy has no published port, no capabilities and no route out). ADR-0014.
  alloy:
    <<: *hardening
    profiles: ["obs"]
    image: grafana/alloy:v1.21.2@sha256:89a5a320168387336b9ac3c850609c3ba7757eadd4ae5f1d819deb35e9854b18
    restart: always
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      # A root-owned path: the image's /var/lib/alloy belongs to its alloy user, which cannot read the Docker socket.
      - --storage.path=/alloy-data
      - --disable-reporting
      - /etc/alloy/config.alloy
    mem_limit: 256m
    pids_limit: 128
    networks: [obs]
    volumes:
      - ./deploy/obs/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/alloy-data
    tmpfs:
      - /tmp:size=32m
    depends_on:
      loki:
        condition: service_started

  grafana:
    <<: *hardening
    profiles: ["obs"]
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    restart: always
    mem_limit: 256m
    pids_limit: 256
    # The internal "obs" network only: nothing Grafana offers (external snapshots, plugin catalogue, news, update checks)
    # can leave the host (phase 7 review B1). obs-edge publishes it on 127.0.0.1. The settings below say the same.
    networks: [obs]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/SECRET_GRAFANA_ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
    secrets:
      - SECRET_GRAFANA_ADMIN_PASSWORD
    volumes:
      - ./deploy/obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/obs/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=32m
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # Grafana's published port (ADR-0014): the same proxy image as edge, on "default" (the port) and "obs" (Grafana).
  obs-edge:
    <<: *hardening
    profiles: ["obs"]
    image: nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: always
    entrypoint: ["nginx", "-g", "daemon off;"]
    mem_limit: 32m
    pids_limit: 32
    networks: [default, obs]
    ports:
      - "127.0.0.1:${VERSO_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/obs/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=16m
    depends_on:
      grafana:
        condition: service_healthy

  # ----- restore drill (profile "drill", scripts/restore-drill.sh) -----
  # A throwaway PostgreSQL with roles only; the dump brings schemas, extensions, grants and data.
  restore-db:
    profiles: ["drill"]
    image: *postgres-image
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_QA_MIGRATE_PASSWORD
      - SECRET_DB_QA_PASSWORD
      - SECRET_DB_AUDIT_MIGRATE_PASSWORD
      - SECRET_DB_AUDIT_PASSWORD
      - SECRET_DB_CONNECTOR_MIGRATE_PASSWORD
      - SECRET_DB_CONNECTOR_PASSWORD
      - SECRET_DB_WORK_MIGRATE_PASSWORD
      - SECRET_DB_WORK_PASSWORD
      - SECRET_DB_BACKUP_PASSWORD
    volumes:
      - ./deploy/postgres/initdb/05-settings.sh:/docker-entrypoint-initdb.d/05-settings.sh:ro
      - ./deploy/postgres/initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs:
      - /var/lib/postgresql:size=${RESTORE_TMPFS_SIZE:-1g}
    networks: [drill]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verso -q"]
      interval: 3s
      timeout: 3s
      retries: 40

  restore-runner:
    profiles: ["drill"]
    <<: *hardening
    image: *postgres-image
    entrypoint: ["bash", "/opt/verso/restore-check.sh"]
    environment:
      PGHOST: restore-db
      PGDATABASE: verso
      BACKUP_DIR: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
      # Self-test hook only (restore-check.sh accepts nothing but --no-privileges).
      RESTORE_OPTIONS: ${RESTORE_OPTIONS:-}
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_QA_PASSWORD
      - SECRET_DB_AUDIT_PASSWORD
      - SECRET_DB_CONNECTOR_PASSWORD
      - SECRET_DB_WORK_PASSWORD
      - SECRET_BACKUP_ENCRYPTION_KEY
    volumes:
      - ./deploy/backup:/opt/verso:ro
      - backups:/backups:ro
    tmpfs:
      - /tmp:size=${RESTORE_TMPFS_SIZE:-1g}
    networks: [drill]
    depends_on:
      restore-db:
        condition: service_healthy

  # Flyway validate against the restored database: the history must match the migrations of this checkout.
  # -ignoreMigrationPatterns= (empty): the default "*:future" would accept applied versions unknown to this checkout
  # (phase 2 test review T4).
  restore-flyway:
    profiles: ["drill"]
    <<: *hardening
    image: flyway/flyway:13.12.0@sha256:3704e17c99e22adb8385552cdf8dd7fbc05ae6c420cb78215d9ac6cf1261a15c
    # The password goes through FLYWAY_PASSWORD, never the argument list.
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$$(cat /run/secrets/SECRET_DB_DOCUMENT_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_document_migrate -schemas=document -defaultSchema=document -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true -ignoreMigrationPatterns= validate"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    secrets:
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
    volumes:
      - ./services/document/document-core/src/main/resources/db/migration/document:/flyway/migrations:ro
    tmpfs:
      - /tmp:size=64m
    networks: [drill]
    depends_on:
      restore-db:
        condition: service_healthy

  # The same validate for the schema "qa" (ADR-0023): one step per module schema, each as its own migration role.
  restore-flyway-qa:
    profiles: ["drill"]
    <<: *hardening
    image: flyway/flyway:13.12.0@sha256:3704e17c99e22adb8385552cdf8dd7fbc05ae6c420cb78215d9ac6cf1261a15c
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$$(cat /run/secrets/SECRET_DB_QA_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_qa_migrate -schemas=qa -defaultSchema=qa -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true -ignoreMigrationPatterns= validate"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    secrets:
      - SECRET_DB_QA_MIGRATE_PASSWORD
    volumes:
      - ./services/qa/qa-core/src/main/resources/db/migration/qa:/flyway/migrations:ro
    tmpfs:
      - /tmp:size=64m
    networks: [drill]
    depends_on:
      restore-db:
        condition: service_healthy

  # The same validate for the schema "audit" (ADR-0026): one step per module schema, each as its own migration role.
  restore-flyway-audit:
    profiles: ["drill"]
    <<: *hardening
    image: flyway/flyway:13.12.0@sha256:3704e17c99e22adb8385552cdf8dd7fbc05ae6c420cb78215d9ac6cf1261a15c
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$$(cat /run/secrets/SECRET_DB_AUDIT_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_audit_migrate -schemas=audit -defaultSchema=audit -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true -ignoreMigrationPatterns= validate"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    secrets:
      - SECRET_DB_AUDIT_MIGRATE_PASSWORD
    volumes:
      - ./services/audit/audit-core/src/main/resources/db/migration/audit:/flyway/migrations:ro
    tmpfs:
      - /tmp:size=64m
    networks: [drill]
    depends_on:
      restore-db:
        condition: service_healthy

  # The same validate for the schema "connector" (ADR-0038).
  restore-flyway-connector:
    profiles: ["drill"]
    <<: *hardening
    image: flyway/flyway:13.12.0@sha256:3704e17c99e22adb8385552cdf8dd7fbc05ae6c420cb78215d9ac6cf1261a15c
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$(cat /run/secrets/SECRET_DB_CONNECTOR_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_connector_migrate -schemas=connector -defaultSchema=connector -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true -ignoreMigrationPatterns= validate"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    secrets:
      - SECRET_DB_CONNECTOR_MIGRATE_PASSWORD
    volumes:
      - ./services/connector/connector-core/src/main/resources/db/migration/connector:/flyway/migrations:ro
    tmpfs:
      - /tmp:size=64m
    networks: [drill]
    depends_on:
      restore-db:
        condition: service_healthy

  # The same validate for the schema "work" (ADR-0057).
  restore-flyway-work:
    profiles: ["drill"]
    <<: *hardening
    image: flyway/flyway:13.12.0@sha256:3704e17c99e22adb8385552cdf8dd7fbc05ae6c420cb78215d9ac6cf1261a15c
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$(cat /run/secrets/SECRET_DB_WORK_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_work_migrate -schemas=work -defaultSchema=work -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true -ignoreMigrationPatterns= validate"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    secrets:
      - SECRET_DB_WORK_MIGRATE_PASSWORD
    volumes:
      - ./services/work/work-core/src/main/resources/db/migration/work:/flyway/migrations:ro
    tmpfs:
      - /tmp:size=64m
    networks: [drill]
    depends_on:
      restore-db:
        condition: service_healthy

secrets:
  SECRET_POSTGRES_SUPERUSER_PASSWORD:
    file: ./secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
  SECRET_DB_DOCUMENT_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
  SECRET_DB_DOCUMENT_PASSWORD:
    file: ./secrets/SECRET_DB_DOCUMENT_PASSWORD
  SECRET_DB_QA_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_QA_MIGRATE_PASSWORD
  SECRET_DB_QA_PASSWORD:
    file: ./secrets/SECRET_DB_QA_PASSWORD
  SECRET_DB_AUDIT_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_AUDIT_MIGRATE_PASSWORD
  SECRET_DB_AUDIT_PASSWORD:
    file: ./secrets/SECRET_DB_AUDIT_PASSWORD
  SECRET_DB_CONNECTOR_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_CONNECTOR_MIGRATE_PASSWORD
  SECRET_DB_CONNECTOR_PASSWORD:
    file: ./secrets/SECRET_DB_CONNECTOR_PASSWORD
  SECRET_DB_WORK_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_WORK_MIGRATE_PASSWORD
  SECRET_DB_WORK_PASSWORD:
    file: ./secrets/SECRET_DB_WORK_PASSWORD
  SECRET_DB_BACKUP_PASSWORD:
    file: ./secrets/SECRET_DB_BACKUP_PASSWORD
  SECRET_BACKUP_ENCRYPTION_KEY:
    file: ./secrets/SECRET_BACKUP_ENCRYPTION_KEY
  SECRET_DB_KEYCLOAK_PASSWORD:
    file: ./secrets/SECRET_DB_KEYCLOAK_PASSWORD
  SECRET_KEYCLOAK_ADMIN_PASSWORD:
    file: ./secrets/SECRET_KEYCLOAK_ADMIN_PASSWORD
  SECRET_KEYCLOAK_CI_CLIENT_SECRET:
    file: ./secrets/SECRET_KEYCLOAK_CI_CLIENT_SECRET
  SECRET_KEYCLOAK_DEMO_USER_PASSWORD:
    file: ./secrets/SECRET_KEYCLOAK_DEMO_USER_PASSWORD
  SECRET_KEYCLOAK_PANEL_ADMIN_PASSWORD:
    file: ./secrets/SECRET_KEYCLOAK_PANEL_ADMIN_PASSWORD
  SECRET_GRAFANA_ADMIN_PASSWORD:
    file: ./secrets/SECRET_GRAFANA_ADMIN_PASSWORD
  SECRET_MODEL_GATEWAY_KEK:
    file: ./secrets/SECRET_MODEL_GATEWAY_KEK

networks:
  # Application ↔ the model servers (ollama, ollama-chat) only; internal: no gateway to the outside (llm-rules 1.1, 8.2; ADR-0011).
  models:
    internal: true
  # Application, database, IdP, backup and the edge proxy; internal as well (ADR-0013). "default" (with a gateway)
  # carries only the published ports and the one-shot model download.
  backend:
    internal: true
  # Observability (profile "obs", ADR-0014); internal as well.
  obs:
    internal: true
  # Restore drill: the restored copy holds every document's text in clear; no route out (phase 6 review L3).
  drill:
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
  pgdata:
  ollama-models:
  backups:
