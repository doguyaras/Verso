# Verso on one host (reference 18.2, ADR-0009). From a fresh clone (repository root):
#
#   bash scripts/dev-secrets.sh && docker compose up -d --build --wait
#
# Non-secret settings: .env (template: .env.example). Secrets: secrets/ files mounted under /run/secrets (reference
# 15.3), never environment variables. Only the API (through the edge proxy) and the demo IdP are published, and only
# on 127.0.0.1; PostgreSQL and the actuator port stay inside the compose network. The application, the database and the
# model server sit on internal networks only: in local mode nothing of Verso has a route to the internet (ADR-0006,
# ADR-0013). Cloud mode: deploy/compose.cloud.yaml. The project name is fixed: a second checkout on the same host shares the
# containers and volumes unless COMPOSE_PROJECT_NAME is set.
name: verso

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-java-service-defaults: &java-service-defaults
  <<: *hardening
  # server.shutdown=graceful with 25s per phase (application.yml) + margin before SIGKILL.
  stop_grace_period: 35s
  mem_limit: ${VERSO_MEM_LIMIT:-1536m}
  cpus: ${VERSO_CPUS:-2}
  pids_limit: 512
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  tmpfs:
    - /tmp:size=256m

# Database and identity provider coordinates inside the compose network; every non-secret placeholder of
# config/verso.yml must be set here for both Java services (ComposeConfigTest).
x-db-env: &db-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: verso
  # Tokens carry the public issuer URL; the keys are fetched over the compose network (ADR-0010).
  OIDC_ISSUER: http://localhost:${VERSO_KEYCLOAK_PORT:-8180}/realms/verso
  OIDC_JWK_SET_URI: http://keycloak:8080/realms/verso/protocol/openid-connect/certs
  # Plain HTTP to a non-loopback host is refused unless allowed explicitly; here the hop never leaves the compose
  # network. A production IdP is fetched over https and keeps the default (false).
  OIDC_JWKS_ALLOW_HTTP: "true"
  # Embeddings from the local Ollama (ADR-0006, ADR-0011); the model name is the one ollama-pull fetched.
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_EMBEDDING_MODEL: &embedding-model bge-m3:567m
  # The local chat model (ADR-0006). VERSO_CHAT_MODEL and its digest can name another one (CI uses a small model).
  OLLAMA_CHAT_MODEL: ${VERSO_CHAT_MODEL:-gemma4:e2b}
  # Local mode, fixed here: only the cloud overlay switches it, together with the network and the key (ADR-0013).
  VERSO_AI_MODE: local
  VERSO_CHAT_PROVIDER: ollama
  # Read in cloud mode only (deploy/compose.cloud.yaml).
  CLOUD_CHAT_MODEL: ${VERSO_CLOUD_CHAT_MODEL:-claude-sonnet-5-5}
  OPENAI_BASE_URL: ${VERSO_OPENAI_BASE_URL:-https://api.openai.com/v1}

x-ollama-image: &ollama-image ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c

x-postgres-image: &postgres-image pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0

services:
  postgres:
    image: *postgres-image
    restart: always
    # Not read_only/cap_drop: the official entrypoint needs root to prepare PGDATA before dropping to postgres.
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 512
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_BACKUP_PASSWORD
      - SECRET_DB_KEYCLOAK_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql
      # Roles, schemas, extensions and settings: run once, on an empty data volume.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    stop_grace_period: 60s
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verso -q"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # One-shot migration with the application image (ADR-0009, review S4): only this container holds the migration
  # role's password. It runs Flyway without a web server and without the application DataSource, then exits.
  migrate:
    <<: *java-service-defaults
    image: verso:${VERSO_IMAGE_TAG:-local}
    # Built by verso-app (same image); never pulled.
    pull_policy: never
    restart: "no"
    mem_limit: 512m
    command:
      - --spring.main.web-application-type=none
      - --spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      # No DataSource, so no "db" health contributor for the readiness group; there is no web server to ask anyway.
      - --management.endpoint.health.validate-group-membership=false
      # No model client either (ADR-0011): the document and qa modules are not loaded without a web server.
      - --spring.ai.model.embedding=none
      - --spring.ai.model.chat=none
    environment:
      <<: *db-env
    secrets:
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  verso-app:
    <<: *java-service-defaults
    build: .
    image: verso:${VERSO_IMAGE_TAG:-local}
    restart: always
    environment:
      <<: *db-env
      # Migrations ran in "migrate": the long-running application cannot run DDL or rewrite the Flyway history.
      SPRING_FLYWAY_ENABLED: "false"
    secrets:
      - SECRET_DB_DOCUMENT_PASSWORD
    # Not published: the edge proxy is the way in (ADR-0013).
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Not depending on ollama on purpose (review E1): uploads are accepted while the model is down or still being
    # pulled; the worker pauses and catches up (ADR-0011).
    # Internal networks only: no route to the internet (ADR-0006 decision 1.1). The cloud overlay adds "egress".
    networks: [backend, models]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Demo identity provider (ADR-0005, ADR-0010): realm "verso" with ES256 tokens, its own database "keycloak". Published
  # on 127.0.0.1 for the device-flow login and the CI smoke token; production uses the customer's IdP instead.
  # Not read_only: Keycloak builds its optimised server and writes caches under /opt/keycloak at startup.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1g}
    pids_limit: 512
    entrypoint: ["bash", "/opt/verso/start.sh"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Fixed frontend URL: every token says iss=http://localhost:<port>/realms/verso, whichever address fetched it.
      KC_HOSTNAME: http://localhost:${VERSO_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Plain HTTP only on 127.0.0.1 and inside the compose network; a TLS reverse proxy sits in front in production.
      KC_HTTP_ENABLED: "true"
    secrets:
      - SECRET_DB_KEYCLOAK_PASSWORD
      - SECRET_KEYCLOAK_ADMIN_PASSWORD
      - SECRET_KEYCLOAK_CI_CLIENT_SECRET
      - SECRET_KEYCLOAK_DEMO_USER_PASSWORD
    volumes:
      - ./deploy/keycloak/start.sh:/opt/verso/start.sh:ro
      - ./deploy/keycloak/realm:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${VERSO_KEYCLOAK_PORT:-8180}:8080"
    # default: the published port (device-flow login, CI token); backend: its database, and the application's key fetch.
    networks: [default, backend]
    depends_on:
      postgres:
        condition: service_healthy
    # No curl in the image: bash's /dev/tcp fetches the realm's discovery document. Not /health/ready: it answers UP
    # while the bootstrap (realm import) still runs in the background and token requests get 503 (observed: 8 s).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/verso/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"token_endpoint\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Model download, once (llm-rules 8.2): a private Ollama server inside this container pulls the embedding model into
  # the volume and checks the pinned layer digest (bge-m3:567m, MIT licence, docs/versions.md). Needs internet only
  # when the model is not in the volume yet.
  ollama-pull:
    <<: *hardening
    image: *ollama-image
    restart: "no"
    entrypoint: ["sh", "/opt/verso/pull.sh"]
    mem_limit: 512m
    pids_limit: 256
    environment:
      # name@digest pairs: the embedding model, then the chat model (bge-m3 MIT, Gemma 4 Gemma terms; docs/versions.md).
      OLLAMA_PULL: >-
        bge-m3:567m@sha256:daec91ffb5dd0c27411bd71f29932917c49cf529a641d0168496c3a501e3062c
        ${VERSO_CHAT_MODEL:-gemma4:e2b}@${VERSO_CHAT_MODEL_DIGEST:-sha256:6dd7ac24fe13a238898e16e253ebc7a72fa27fb83f2658c2f6c241df3af5937d}
    volumes:
      - ollama-models:/root/.ollama
      - ./deploy/ollama/pull.sh:/opt/verso/pull.sh:ro
    tmpfs:
      - /tmp:size=64m

  # Local embedding model server (ADR-0006, ADR-0011). Only on the internal "models" network: no route to the internet
  # (llm-rules 8.2) and nobody but the application can reach it. It never pulls (ollama-pull did) and reads the models
  # read-only.
  ollama:
    <<: *hardening
    image: *ollama-image
    restart: always
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    cpus: ${OLLAMA_CPUS:-2}
    pids_limit: 512
    networks: [models]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # No ollama.com cloud models or remotes (llm-rules 1.1, 8.2).
      OLLAMA_NO_CLOUD: "true"
      # Keep both models loaded between questions and ingestion batches.
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-models:/root/.ollama:ro
    tmpfs:
      - /tmp:size=256m
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ollama show bge-m3:567m >/dev/null && ollama show ${VERSO_CHAT_MODEL:-gemma4:e2b} >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Encrypted logical backups on a schedule (ADR-0009): pg_dump as verso_backup (pg_read_all_data), gpg AES256,
  # SHA-256 sum, row-count manifest and privilege fingerprint taken in the same snapshot. RPO = BACKUP_INTERVAL_SECONDS.
  backup:
    <<: *hardening
    image: *postgres-image
    restart: always
    # tini as PID 1: "docker compose stop" ends the loop with SIGTERM instead of SIGKILL (review E9).
    init: true
    mem_limit: 512m
    pids_limit: 128
    entrypoint: ["bash", "/opt/verso/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGDATABASE: verso
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    secrets:
      - SECRET_DB_BACKUP_PASSWORD
      - SECRET_BACKUP_ENCRYPTION_KEY
    volumes:
      - ./deploy/backup:/opt/verso:ro
      - backups:/backups
    tmpfs:
      - /tmp:size=64m
    networks: [backend]
    # Healthy only while the last successful backup is younger than two intervals (+10 min): a failing backup is
    # visible in "docker compose ps", not only in the logs (review E7).
    healthcheck:
      test: ["CMD", "bash", "-c", "f=/backups/last-success; [ -s $$f ] && [ $$(( $$(date +%s) - $$(date -d \"$$(cat $$f)\" +%s) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS} * 2 + 600 )) ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy

  # Edge proxy (ADR-0013): the API's only published port. The application has no published port and no route out; this
  # container bridges 127.0.0.1:VERSO_HTTP_PORT to it and answers 503 in the common envelope while it is down.
  edge:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.29.8-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: always
    # The image's entrypoint scripts rewrite files under /etc/nginx; the configuration is mounted read-only instead.
    entrypoint: ["nginx", "-g", "daemon off;"]
    mem_limit: 64m
    pids_limit: 64
    networks: [default, backend]
    ports:
      - "127.0.0.1:${VERSO_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=32m
    depends_on:
      verso-app:
        condition: service_healthy

  # ----- restore drill (profile "drill", scripts/restore-drill.sh) -----
  # A throwaway PostgreSQL with roles only; the dump brings schemas, extensions, grants and data.
  restore-db:
    profiles: ["drill"]
    image: *postgres-image
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: verso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_DB_BACKUP_PASSWORD
    volumes:
      - ./deploy/postgres/initdb/05-settings.sh:/docker-entrypoint-initdb.d/05-settings.sh:ro
      - ./deploy/postgres/initdb/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs:
      - /var/lib/postgresql:size=${RESTORE_TMPFS_SIZE:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verso -q"]
      interval: 3s
      timeout: 3s
      retries: 40

  restore-runner:
    profiles: ["drill"]
    <<: *hardening
    image: *postgres-image
    entrypoint: ["bash", "/opt/verso/restore-check.sh"]
    environment:
      PGHOST: restore-db
      PGDATABASE: verso
      BACKUP_DIR: /backups
      BACKUP_FILE: ${BACKUP_FILE:-}
      # Self-test hook only (restore-check.sh accepts nothing but --no-privileges).
      RESTORE_OPTIONS: ${RESTORE_OPTIONS:-}
    secrets:
      - SECRET_POSTGRES_SUPERUSER_PASSWORD
      - SECRET_DB_DOCUMENT_PASSWORD
      - SECRET_BACKUP_ENCRYPTION_KEY
    volumes:
      - ./deploy/backup:/opt/verso:ro
      - backups:/backups:ro
    tmpfs:
      - /tmp:size=${RESTORE_TMPFS_SIZE:-1g}
    depends_on:
      restore-db:
        condition: service_healthy

  # Flyway validate against the restored database: the history must match the migrations of this checkout.
  # -ignoreMigrationPatterns= (empty): the default "*:future" would accept applied versions unknown to this checkout
  # (phase 2 test review T4).
  restore-flyway:
    profiles: ["drill"]
    <<: *hardening
    image: flyway/flyway:12.4.0@sha256:5be18367a9b3979a9f37234c371b80da457a448fb9577bd94d4bf24d923fafac
    # The password goes through FLYWAY_PASSWORD, never the argument list.
    entrypoint: ["bash", "-c", "FLYWAY_PASSWORD=\"$$(cat /run/secrets/SECRET_DB_DOCUMENT_MIGRATE_PASSWORD)\" exec flyway -url=jdbc:postgresql://restore-db:5432/verso -user=svc_document_migrate -schemas=document -defaultSchema=document -createSchemas=false -locations=filesystem:/flyway/migrations -validateMigrationNaming=true -ignoreMigrationPatterns= validate"]
    environment:
      REDGATE_DISABLE_TELEMETRY: "true"
    secrets:
      - SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
    volumes:
      - ./services/document/document-core/src/main/resources/db/migration/document:/flyway/migrations:ro
    tmpfs:
      - /tmp:size=64m
    depends_on:
      restore-db:
        condition: service_healthy

secrets:
  SECRET_POSTGRES_SUPERUSER_PASSWORD:
    file: ./secrets/SECRET_POSTGRES_SUPERUSER_PASSWORD
  SECRET_DB_DOCUMENT_MIGRATE_PASSWORD:
    file: ./secrets/SECRET_DB_DOCUMENT_MIGRATE_PASSWORD
  SECRET_DB_DOCUMENT_PASSWORD:
    file: ./secrets/SECRET_DB_DOCUMENT_PASSWORD
  SECRET_DB_BACKUP_PASSWORD:
    file: ./secrets/SECRET_DB_BACKUP_PASSWORD
  SECRET_BACKUP_ENCRYPTION_KEY:
    file: ./secrets/SECRET_BACKUP_ENCRYPTION_KEY
  SECRET_DB_KEYCLOAK_PASSWORD:
    file: ./secrets/SECRET_DB_KEYCLOAK_PASSWORD
  SECRET_KEYCLOAK_ADMIN_PASSWORD:
    file: ./secrets/SECRET_KEYCLOAK_ADMIN_PASSWORD
  SECRET_KEYCLOAK_CI_CLIENT_SECRET:
    file: ./secrets/SECRET_KEYCLOAK_CI_CLIENT_SECRET
  SECRET_KEYCLOAK_DEMO_USER_PASSWORD:
    file: ./secrets/SECRET_KEYCLOAK_DEMO_USER_PASSWORD

networks:
  # Application ↔ ollama only; internal: no gateway to the outside (llm-rules 1.1, 8.2; ADR-0011).
  models:
    internal: true
  # Application, database, IdP, backup and the edge proxy; internal as well (ADR-0013). "default" (with a gateway)
  # carries only the published ports and the one-shot model download.
  backend:
    internal: true

volumes:
  pgdata:
  ollama-models:
  backups:
