# GPU overlay: Ollama runs the embedding and chat models on an NVIDIA GPU (ADR-0008 local-GPU budget, docs/capacity.md).
# Opt-in: the default stack targets CPU hosts. Needs the NVIDIA driver and Docker GPU support (Docker Desktop with
# WSL 2, or the NVIDIA Container Toolkit on Linux); without them the container does not start. AMD GPUs need the
# ollama/ollama:rocm image and are not covered here.
#
#   docker compose -f compose.yaml -f deploy/compose.gpu.yaml up -d --build --wait
#
# Only the device reservation changes: the networks, the read-only model volume and the memory limit stay as they are,
# so local mode still has no route out (llm-rules 8.2). Combine with deploy/compose.local.yaml or compose.cloud.yaml
# by adding this file after them.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
