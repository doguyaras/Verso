# Local development overlay: publishes PostgreSQL on 127.0.0.1 for an IDE run with the "local" profile
# (application-local.yml). Port VERSO_DB_LOCAL_PORT, default 5432, on both sides (review E6). Never used in
# production, where the database stays inside the compose network.
#
#   docker compose -f compose.yaml -f deploy/compose.local.yaml up -d postgres
services:
  postgres:
    ports:
      - "127.0.0.1:${VERSO_DB_LOCAL_PORT:-5432}:5432"
