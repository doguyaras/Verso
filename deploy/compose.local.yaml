# Local development overlay: publishes PostgreSQL on 127.0.0.1 for an IDE run with the "local" profile
# (application-local.yml). Port VERSO_DB_LOCAL_PORT, default 5432, on both sides (review E6). Never used in
# production, where the database stays inside the compose network.
#
#   docker compose -f compose.yaml -f deploy/compose.local.yaml up -d postgres ollama
services:
  postgres:
    # The published port needs a network with a gateway; production keeps the database on "backend" alone.
    networks: [backend, default]
    ports:
      - "127.0.0.1:${VERSO_DB_LOCAL_PORT:-5432}:5432"
  # The IDE run's embedding model (application-local.yml: localhost:11434). Local development only: here ollama also
  # joins the default network, which has an internet route; the production stack keeps it on "models" alone (ADR-0011).
  ollama:
    networks: [models, default]
    ports:
      - "127.0.0.1:${VERSO_OLLAMA_LOCAL_PORT:-11434}:11434"
