# The basic alerts (reference 8.7; ADR-0014). Each names its runbook under docs/runbooks/. Severity "page" is
# user-facing (wake someone), "ticket" is next working day. Thresholds are starting values; phase 8 measures them.
# Unit tests: alerts.test.yml (promtool test rules, CI). Phase 7 review R1/R2: model and database outages are
# detected from outcomes and from the NaN the queue gauges report, not from duty cycles that a slow failure never fills.
groups:
  - name: verso
    rules:
      - alert: VersoDown
        expr: up{job="verso"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: The Verso API does not answer the metrics scrape.
          runbook: docs/runbooks/verso-down.md

      # Server errors among API requests (the management port excluded), only with real traffic.
      - alert: VersoHighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="verso", status=~"5..", uri!~"/actuator.*"}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="verso", uri!~"/actuator.*"}[5m]))
          ) > 0.05
          and sum(rate(http_server_requests_seconds_count{job="verso", uri!~"/actuator.*"}[5m])) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: More than 5% of API requests fail with 5xx.
          runbook: docs/runbooks/high-error-rate.md

      # The database does not answer: the queue gauges read NaN (IngestionMetrics), while the API may still be up.
      - alert: VersoDatabaseUnavailable
        expr: verso_ingestion_oldest_due_wait_seconds{job="verso"} != verso_ingestion_oldest_due_wait_seconds{job="verso"}
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The application cannot read its database.
          runbook: docs/runbooks/database-unavailable.md

      # A due document has waited longer than the worker lease (10 min): the worker is stuck, paused or too slow.
      - alert: IngestionBacklog
        expr: verso_ingestion_oldest_due_wait_seconds{job="verso"} > 600
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Uploaded documents wait for processing longer than 10 minutes.
          runbook: docs/runbooks/ingestion-backlog.md

      # The docling sidecar (ADR-0032) was asked and every document of the last 30 minutes fell back to the JDK parser:
      # tables lose their structure and scanned PDFs wait. Never fires without the overlay (no fallback series).
      - alert: DoclingFallback
        expr: |
          sum(increase(verso_ingestion_parsed_total{job="verso", fallback!="none"}[30m])) > 0
          unless sum(increase(verso_ingestion_parsed_total{job="verso", parser="docling"}[30m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: The docling sidecar parsed nothing for 30 minutes; documents fall back to the JDK parser.
          runbook: docs/runbooks/docling-fallback.md

      # The reranker sidecar (ADR-0043) was asked and no question of the last 30 minutes was reranked: answers use the
      # fused order (still correct, ranking as without the overlay). Never fires without the overlay (nothing counted).
      - alert: RerankerFallback
        expr: |
          sum(increase(verso_retrieval_rerank_total{job="verso", outcome!="reranked"}[30m])) > 0
          unless sum(increase(verso_retrieval_rerank_total{job="verso", outcome="reranked"}[30m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: The reranker sidecar reranked nothing for 30 minutes; questions use the fused order.
          runbook: docs/runbooks/reranker-fallback.md

      # A model fails and nothing succeeds: questions end as model_unavailable/circuit_open with no answer, or the
      # worker hands documents back (released) with none finished. Whatever the traffic and however slow the failure.
      - alert: ModelUnavailable
        expr: |
          (
            sum(increase(verso_qa_questions_total{job="verso", outcome=~"model_unavailable|circuit_open"}[10m])) > 0
            unless sum(increase(verso_qa_questions_total{job="verso", outcome=~"answered|uncited"}[10m])) > 0
          )
          or
          (
            sum(increase(verso_ingestion_documents_total{job="verso", outcome="released"}[10m])) > 0
            unless sum(increase(verso_ingestion_documents_total{job="verso", outcome="ready"}[10m])) > 0
          )
          or
          avg_over_time(verso_ingestion_paused{job="verso"}[10m]) > 0.5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: A model (embedding or chat) fails and nothing succeeds.
          runbook: docs/runbooks/model-unavailable.md

      # p95 of one successful chat call above the local CPU budget (ADR-0008: 60 s). Failed calls: ModelUnavailable.
      - alert: QaSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(verso_qa_chat_duration_seconds_bucket{job="verso"}[15m]))) > 60
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: The 95th percentile of chat model calls is above 60 seconds.
          runbook: docs/runbooks/qa-slow.md

      # ADR-0001 split trigger: the p99 of whole question requests (retrieval + model, stream included) over the last
      # day is above the local-GPU budget (ADR-0008: 15 s) and stays so for two more days, i.e. three days in a row.
      # Needs at least 100 answered questions a day for a p99 to mean anything. Local-CPU installs (budget 60 s) and
      # cloud (20 s) change the number: docs/evidence/yuk-olcumu.md.
      - alert: QaP99OverBudget
        expr: |
          histogram_quantile(0.99, sum by (le) (increase(http_server_requests_seconds_bucket{job="verso", uri=~"/v1/questions(/stream)?", outcome="SUCCESS"}[1d]))) > 15
          and sum(increase(http_server_requests_seconds_count{job="verso", uri=~"/v1/questions(/stream)?", outcome="SUCCESS"}[1d])) >= 100
        for: 2d
        labels:
          severity: ticket
        annotations:
          summary: The 99th percentile of answered questions is above the 15 second budget for three days in a row (ADR-0001 split trigger).
          runbook: docs/runbooks/qa-slow.md

      # Answers are returned but not stored in the conversation history (ADR-0023): the qa pool cannot write (wrong
      # svc_qa password, missing "qa" schema, database). History and usage metrics then miss questions. A full
      # conversation (reason="conversation_full") is the client's case, not an outage.
      - alert: HistoryNotStored
        expr: sum(increase(verso_qa_history_not_stored_total{job="verso", reason="failed"}[10m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Answers are not stored in the conversation history.
          runbook: docs/runbooks/history-not-stored.md
      # Audit rows are lost (ADR-0026): the audit pool cannot write (wrong svc_audit password, missing "audit" schema,
      # database). The audited requests still succeed, so users notice nothing and the gap in the trail is permanent:
      # page, not ticket. Every reason counts (failed, circuit_open, invalid, capture_failed). Since ADR-0039 the document
      # and qa records go through their outbox and are delayed, not lost, by an audit outage (OutboxOldestPendingTooOld).
      - alert: AuditEventNotStored
        expr: sum(increase(verso_audit_events_not_stored_total{job="verso"}[10m])) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Audit events are not being stored.
          runbook: docs/runbooks/audit-write-failed.md
      # The outbox relay is stuck (ADR-0039, reference 14.3): an audit record has waited longer than the relay lease
      # (120 s). Nothing is lost yet (the record is in the module's own schema), but the audit log is behind; the age
      # keeps growing while the relay or the audit database is away.
      - alert: OutboxOldestPendingTooOld
        expr: max by (outbox) (outbox_oldest_pending_age_seconds{job="verso"}) > 120
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Outbox rows are waiting longer than the relay lease.
          runbook: docs/runbooks/outbox-stuck.md
      # A record gave up (ADR-0039): a payload the audit log refused max-attempts times. It is kept for the failure
      # retention (verso.outbox.dead-retention, 30 days) and then deleted: the trail has a hole unless someone acts.
      - alert: OutboxDeadRows
        expr: max by (outbox) (outbox_dead_rows{job="verso"}) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: Outbox rows gave up and wait for the failure retention.
          runbook: docs/runbooks/outbox-stuck.md

      # A file-share connector (ADR-0038) has had no successful sync for three schedule intervals: the index silently
      # falls behind its source (the top complaint about other products: "success" in the UI, a stopped index behind).
      # The lag grows at scrape time from the last success, whatever the last run reported. The factor 3 is
      # verso.connector.stale-factor; the API shows the same connector as STALE.
      - alert: ConnectorSyncStale
        expr: |
          max by (connector) (verso_connector_sync_lag_seconds{job="verso"})
            > 3 * max by (connector) (verso_connector_schedule_seconds{job="verso"})
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: A file-share connector has not synced successfully for three schedule intervals.
          runbook: docs/runbooks/connector-sync-stale.md
