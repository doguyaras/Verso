# Grafana's published port (profile "obs", ADR-0014; phase 7 review B1). Grafana itself sits on the internal "obs"
# network only, so no snapshot, plugin catalogue, news feed or update check can leave the host; this proxy is the only
# way in, on 127.0.0.1.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 4m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 3000;
        location / {
            set $grafana http://grafana:3000;
            proxy_pass $grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Grafana Live (websocket).
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_read_timeout 120s;
        }
    }
}
