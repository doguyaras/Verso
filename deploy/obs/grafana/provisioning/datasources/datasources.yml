# Provisioned with fixed uids (reference 8.7): dashboards and alerts refer to them, a re-created Grafana keeps them.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: verso-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: verso-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
