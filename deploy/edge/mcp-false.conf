# The MCP server is off (ADR-0031, VERSO_MCP_ENABLED=false, the default): the edge answers /mcp and its RFC 9728
# metadata with 404 itself, so the route is not reachable even if the application were misconfigured. Mounted by
# compose.yaml as /etc/nginx/mcp.conf; mcp-true.conf is the other choice.
map $host $mcp_enabled {
    default 0;
}
