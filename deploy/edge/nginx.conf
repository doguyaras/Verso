# Edge proxy (ADR-0013): the only published port of the API. The application sits on internal networks only, so in
# local mode it has no route to the internet (ADR-0006 decision 1.1); this container bridges the published port to it.
# Plain HTTP on 127.0.0.1; a TLS terminator sits in front in production (reference 18.2).
worker_processes 1;
pid /tmp/nginx.pid;
# "crit": at "error" and below nginx writes the client address and the raw request line (document ids) for every
# refused or failed request (phase 6 review B1, security-rules 4). Configuration errors are "emerg" and still show.
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    # No access log: request lines carry document ids and the application already logs every request it serves
    # (llm-rules 2.1).
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Docker's resolver, re-asked every 10 s: a restarted application keeps its name, not its address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # $rag_mode: local or cloud, from the file compose mounts for the mode.
    include /etc/nginx/mode.conf;

    server {
        listen 8080;
        # Above the application's multipart limit (21 MB, ADR-0011), so the application answers its own 413 envelope
        # up to here; beyond it this proxy refuses with the same code.
        client_max_body_size 22m;

        # Responses this proxy writes itself (the request never reached the application, or the application is down)
        # carry the common error envelope (ADR-0004) and X-Rag-Mode (llm-rules 1.3). Upstream errors pass through as
        # they are (proxy_intercept_errors is off).
        error_page 400 414 494 = @rejected;
        error_page 413 = @too_large;
        error_page 500 502 503 504 = @unavailable;

        # The panel (ADR-0015): static files, same origin as the API. Scripts and styles only from here; the only
        # other origin the page talks to is the IdP's token endpoint (sign-in, refresh). No inline script, no framing;
        # Trusted Types 'none' makes the browser refuse every HTML sink (innerHTML and the like), not only the tests.
        # absolute_redirect off: a relative Location, right behind a TLS terminator too (phase 10 review E2).
        location = /panel {
            absolute_redirect off;
            return 301 /panel/;
        }
        location /panel/ {
            alias /usr/share/verso-panel/;
            index index.html;
            default_type application/octet-stream;
            types {
                text/html html;
                text/css css;
                text/javascript js;
                image/svg+xml svg;
                font/woff2 woff2;
            }
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8180; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control "no-cache" always;
            add_header X-Rag-Mode $rag_mode always;
        }

        # The installation's branding (ADR-0021): branding.json and its logo from deploy/branding/, mounted read-only.
        # Public on purpose: the intro screen shows it before sign-in, so it never holds a secret. "no-cache": the browser
        # revalidates on every load (ETag), so an edited file shows on the next reload, without a restart. A missing file
        # is a plain 404 and the panel keeps the defaults of panel/js/config.js. Both are data, never a page: the CSP
        # sandbox keeps a logo SVG opened on its own from running script on this origin.
        location = /branding.json {
            alias /usr/share/verso-branding/branding.json;
            default_type application/json;
            types {
                application/json json;
            }
            charset utf-8;
            charset_types application/json;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
            add_header X-Rag-Mode $rag_mode always;
        }
        # Only image files directly in the directory, with the name pattern the panel accepts (panel/js/branding.js).
        location ~ "^/branding/([A-Za-z0-9][A-Za-z0-9_-]{0,63}\.(?:svg|png|webp))$" {
            alias /usr/share/verso-branding/$1;
            default_type application/octet-stream;
            types {
                image/svg+xml svg;
                image/png png;
                image/webp webp;
            }
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; sandbox" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
            add_header X-Rag-Mode $rag_mode always;
        }
        location /branding/ {
            add_header X-Rag-Mode $rag_mode always;
            return 404;
        }

        location / {
            set $app http://verso-app:8080;
            # No URI part: the request line goes upstream exactly as the client sent it.
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Client-supplied forwarding headers never reach the application (phase 6 review B2).
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            # Streamed: the upload limiter decides before the body is read (ADR-0011).
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            # Above the worst case of a question (about 105 s, ADR-0008).
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            proxy_intercept_errors off;
        }

        # A streamed answer (ADR-0035): server-sent events reach the client as they are written, so this location alone
        # turns response buffering off (the rest of the API keeps it). The application writes a keep-alive comment after
        # 10 s of silence, so the read timeout only fires for a dead upstream; it stays above the slowest answer.
        # connect-src 'self' of the panel CSP already covers a fetch stream to this path.
        location = /v1/questions/stream {
            set $app http://verso-app:8080;
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            proxy_intercept_errors off;
        }

        location @rejected {
            default_type application/json;
            add_header X-Rag-Mode $rag_mode always;
            add_header Cache-Control "no-store" always;
            return 400 '{"ok":false,"data":null,"error":{"code":90004,"message":"Request was rejected.","service":"validation","path":"","timestamp":0,"traceId":"","details":[]}}';
        }

        location @too_large {
            default_type application/json;
            add_header X-Rag-Mode $rag_mode always;
            add_header Cache-Control "no-store" always;
            return 413 '{"ok":false,"data":null,"error":{"code":90014,"message":"Request payload is too large.","service":"validation","path":"","timestamp":0,"traceId":"","details":[]}}';
        }

        # The application is down or restarting. 99997 SERVICE_UNAVAILABLE.
        location @unavailable {
            default_type application/json;
            add_header X-Rag-Mode $rag_mode always;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            return 503 '{"ok":false,"data":null,"error":{"code":99997,"message":"Service is temporarily unavailable.","service":"system","path":"","timestamp":0,"traceId":"","details":[]}}';
        }
    }
}
