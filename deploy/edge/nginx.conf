# Edge proxy (ADR-0013): the only published port of the API. The application sits on internal networks only, so in
# local mode it has no route to the internet (ADR-0006 decision 1.1); this container bridges the published port to it.
# Plain HTTP on 127.0.0.1; a TLS terminator sits in front in production (reference 18.2).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    # No access log: request lines carry document ids and the application already logs every request it serves
    # (llm-rules 2.1).
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Docker's resolver, re-asked every 10 s: a restarted application keeps its name, not its address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        # The application's multipart request limit (21 MB, ADR-0011); a bigger body is refused here first.
        client_max_body_size 21m;

        location / {
            set $app http://verso-app:8080;
            # No URI part: the request line goes upstream exactly as the client sent it.
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Streamed: the upload limiter decides before the body is read (ADR-0011).
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            # Above the worst case of a question (about 105 s, ADR-0008).
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            proxy_intercept_errors off;
            error_page 502 503 504 = @unavailable;
        }

        # The application is down or restarting: the client gets the common error envelope (ADR-0004) and a retry
        # hint, not nginx's HTML page. 99997 SERVICE_UNAVAILABLE.
        location @unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            return 503 '{"ok":false,"data":null,"error":{"code":99997,"message":"Service is temporarily unavailable.","service":"system","path":"","timestamp":0,"traceId":"","details":[]}}';
        }
    }
}
