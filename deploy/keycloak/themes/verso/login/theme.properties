# Verso login theme (ADR-0017, ADR-0018): keycloak.v2 (PatternFly 5) with Verso's colours, a brand panel and Turkish copy.
# CSS and markup only; no scripts of its own. "styles" replaces the parent's list, so the parent's file comes first.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/verso-fildisi.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
# Always the ivory light page, like the panel by default (ADR-0018); the dark rules in the stylesheet stay for later.
darkMode=false
locales=tr,en
