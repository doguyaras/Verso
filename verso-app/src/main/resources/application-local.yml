# Local profile only (IDE run against the local compose infrastructure). Plain-text logs stay readable here;
# every other environment logs ECS JSON (config/verso.yml). No real secrets in this file (reference 15.2).
#
# The database is the compose postgres published on 127.0.0.1 by deploy/compose.local.yaml. Passwords are the files
# that scripts/dev-secrets.sh wrote to secrets/ (config tree, relative to the working directory, which must be the
# repository root: Boot skips a config tree whose path contains "..", so "../secrets/" cannot work; review C2).
spring:
  config:
    import:
      - "optional:configtree:secrets/"
  ai:
    model:
      # Local mode (ADR-0006); an IDE run in cloud mode sets VERSO_AI_MODE, VERSO_CHAT_PROVIDER and the key file.
      chat: ${VERSO_CHAT_PROVIDER:ollama}
    anthropic:
      chat:
        model: ${CLOUD_CHAT_MODEL:claude-sonnet-5-5}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${CLOUD_CHAT_MODEL}
    ollama:
      # The compose ollama published on 127.0.0.1 by deploy/compose.local.yaml (or a host Ollama with this model).
      base-url: http://localhost:11434
      embedding:
        model: bge-m3:567m
      chat:
        model: gemma4:e2b
verso:
  ai:
    mode: ${VERSO_AI_MODE:local}
    # The chat model's own Ollama (ADR-0062), published on 127.0.0.1 by deploy/compose.local.yaml.
    ollama-chat-base-url: http://localhost:${VERSO_OLLAMA_CHAT_LOCAL_PORT:11435}
  # The qa schema's own roles (ADR-0023), on the same local database; passwords from secrets/ like the others.
  qa:
    datasource:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      username: svc_qa
    flyway:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      user: svc_qa_migrate
    # Follow-up rewrite switch (ADR-0046), the same variable as the deploy; the rest of verso.qa.followup is shared.
    followup:
      enabled: ${VERSO_QA_FOLLOWUP_ENABLED:true}
    # Multi-step reasoning switch (ADR-0055), the same variable as the deploy; the rest of verso.qa.reasoning is shared.
    reasoning:
      enabled: ${VERSO_QA_REASONING_ENABLED:false}
    # Groundedness check switch (ADR-0047), the same variable as the deploy.
    grounding:
      enabled: ${VERSO_QA_GROUNDING_ENABLED:true}
    # Answer relevance switch (ADR-0064), the same variable as the deploy.
    relevance:
      enabled: ${VERSO_QA_RELEVANCE_ENABLED:true}
    # Answer memory switches (ADR-0049), the same variables as the deploy; the rest of verso.qa.knowledge is shared.
    knowledge:
      enabled: ${VERSO_QA_KNOWLEDGE_ENABLED:true}
      two-person-rule: ${VERSO_QA_KNOWLEDGE_TWO_PERSON_RULE:false}
    # The procedure box switch (ADR-0053), the same variable as the deploy; the rest of verso.qa.skills is shared.
    skills:
      serving-enabled: ${VERSO_QA_SKILLS_SERVING_ENABLED:false}
    # The system-model suggestion switch (ADR-0054), the same variable as the deploy; the rest is shared.
    system-model:
      suggestions-enabled: ${VERSO_QA_SYSTEM_MODEL_SUGGESTIONS_ENABLED:false}
  # The audit schema's own roles (ADR-0026), on the same local database; passwords from secrets/ like the others.
  audit:
    datasource:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      username: svc_audit
    flyway:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      user: svc_audit_migrate
  # The connector schema's own roles (ADR-0038), on the same local database; passwords from secrets/ like the others.
  connector:
    datasource:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      username: svc_connector
    flyway:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      user: svc_connector_migrate
  # The work schema's own roles (ADR-0057), on the same local database; passwords from secrets/ like the others.
  work:
    datasource:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      username: svc_work
    flyway:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      user: svc_work_migrate
  # The docling sidecar (ADR-0032) is off for an IDE run; a sidecar started by hand on 127.0.0.1:5001 can be used by
  # setting VERSO_DOCLING_ENABLED=true.
  document:
    # The document schema's own roles (ADR-0039), on the same local database; passwords from secrets/ like the others.
    datasource:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      username: svc_document
    flyway:
      url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
      user: svc_document_migrate
    docling:
      enabled: ${VERSO_DOCLING_ENABLED:false}
      base-url: http://localhost:5001
    # The reranker sidecar (ADR-0043) is off for an IDE run; a TEI started by hand on 127.0.0.1:8089 can be used by
    # setting VERSO_RERANKER_ENABLED=true.
    reranker:
      enabled: ${VERSO_RERANKER_ENABLED:false}
      base-url: http://localhost:8089
    # The system-model retrieval enrichment switch (ADR-0054), the same variable as the deploy.
    system-model:
      enrichment-enabled: ${VERSO_DOCUMENT_SYSTEM_MODEL_ENRICHMENT_ENABLED:false}
  security:
    jwt:
      # The compose Keycloak published on 127.0.0.1 (VERSO_KEYCLOAK_PORT, default 8180).
      issuer: http://localhost:${VERSO_KEYCLOAK_PORT:8180}/realms/verso
      jwk-set-uri: http://localhost:${VERSO_KEYCLOAK_PORT:8180}/realms/verso/protocol/openid-connect/certs
      # Microsoft Entra ID (ADR-0041): off in an IDE run; docs/entra-kurulumu.md for a test tenant.
      entra:
        tenant-id: ""
        authority: https://login.microsoftonline.com
        jwk-set-uri: ""
        audiences: ""
        mcp-audiences: ""
    # The compose Keycloak's token shape (ADR-0019): realm roles and the panel's "groups" mapper.
    authorities:
      roles-claim: realm_access.roles
      client-roles-claim: ""
      groups-claim: groups
  # The MCP endpoint of an IDE run (ADR-0031): the application itself on 8080, no edge proxy. Still off unless
  # VERSO_MCP_ENABLED=true.
  mcp:
    resource: http://localhost:8080/mcp
management:
  endpoint:
    health:
      show-details: always
