# Local profile only (IDE run against the local compose infrastructure). Plain-text logs stay readable here;
# every other environment logs ECS JSON (config/verso.yml). No real secrets in this file (reference 15.2).
#
# The database is the compose postgres published on 127.0.0.1 by deploy/compose.local.yaml. Passwords are the files
# that scripts/dev-secrets.sh wrote to secrets/ (config tree, relative to the working directory, which must be the
# repository root: Boot skips a config tree whose path contains "..", so "../secrets/" cannot work; review C2).
spring:
  config:
    import:
      - "optional:configtree:secrets/"
  datasource:
    url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
    username: svc_document
  flyway:
    url: jdbc:postgresql://localhost:${VERSO_DB_LOCAL_PORT:5432}/verso?logServerErrorDetail=false
    user: svc_document_migrate
  ai:
    model:
      # Local mode (ADR-0006); an IDE run in cloud mode sets VERSO_AI_MODE, VERSO_CHAT_PROVIDER and the key file.
      chat: ${VERSO_CHAT_PROVIDER:ollama}
    anthropic:
      chat:
        model: ${CLOUD_CHAT_MODEL:claude-sonnet-5-5}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${CLOUD_CHAT_MODEL:gpt-5-mini}
    ollama:
      # The compose ollama published on 127.0.0.1 by deploy/compose.local.yaml (or a host Ollama with this model).
      base-url: http://localhost:11434
      embedding:
        model: bge-m3:567m
      chat:
        model: gemma4:e2b
verso:
  ai:
    mode: ${VERSO_AI_MODE:local}
  security:
    jwt:
      # The compose Keycloak published on 127.0.0.1 (VERSO_KEYCLOAK_PORT, default 8180).
      issuer: http://localhost:${VERSO_KEYCLOAK_PORT:8180}/realms/verso
      jwk-set-uri: http://localhost:${VERSO_KEYCLOAK_PORT:8180}/realms/verso/protocol/openid-connect/certs
management:
  endpoint:
    health:
      show-details: always
