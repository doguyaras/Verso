# Spring TestContext: at most 12 cached application contexts (default 32). Every context holds its own module pools on
# the one shared test PostgreSQL (VersoPostgres); evicted contexts are closed and give their connections back. The
# verso-app suite has more distinct context configurations than that, so the least recently used ones are rebuilt when
# needed: slower than keeping them, but bounded (CI "remaining connection slots are reserved", 2026-10-28).
spring.test.context.cache.maxSize=12
