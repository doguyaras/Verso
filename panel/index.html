<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Verso</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/panel.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Menü">
      <a class="brand" href="#/overview" aria-label="Verso ana sayfa">
        <span class="brand-mark" aria-hidden="true">V</span>
        <span class="brand-text"><strong>Verso</strong><small>Belge asistanı</small></span>
      </a>
      <nav class="nav" id="nav" aria-label="Ekranlar"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-button only-mobile" id="menu-toggle" type="button" aria-label="Menüyü aç" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="topbar-title">
          <span class="crumb" id="crumb"></span>
          <h1 id="page-title">Verso</h1>
        </div>
        <div class="topbar-actions">
          <span class="mode-pill" id="mode" hidden></span>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Tema"></button>
          <div class="user-menu" id="user"></div>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="gate" id="gate">
    <div class="gate-loading" aria-live="polite">
      <span class="brand-mark big" aria-hidden="true">V</span>
      <span class="spinner" aria-hidden="true"></span>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <noscript>Verso paneli JavaScript gerektirir.</noscript>
</body>
</html>
