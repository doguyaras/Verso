<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Verso</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/panel.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="sr-only" href="#main">İçeriğe geç</a>
  <div class="shell" id="shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Ana menü">
      <a class="brand" id="brand" href="#/overview" aria-label="Verso, genel bakış">
        <span class="brand-text"><strong>Verso</strong><small>Belge asistanı</small></span>
      </a>
      <button class="search-trigger" id="search" type="button" aria-label="Ara (Ctrl+K)" aria-keyshortcuts="Control+K Meta+K"></button>
      <nav class="nav" id="nav" aria-label="Ekranlar"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="workspace">
      <header class="mobilebar" id="mobilebar"></header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <nav class="tabbar" id="tabbar" aria-label="Ekranlar"></nav>
  </div>
  <div class="gate" id="gate">
    <div class="gate-loading" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Oturum açılıyor…</span>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <noscript>Verso paneli JavaScript gerektirir.</noscript>
</body>
</html>
