# Accepted vulnerabilities for the monthly scan (ADR-0030, docs/runbooks/aylik-guvenlik-taramasi.md).
# Every entry needs a justification and an expiry date. An expired entry waives nothing, fails the gate and fails
# `node --test scripts/vuln-gate.test.js`. Do not renew silently: re-assess, then pick a new date (max ~6 months; a
# package-wide entry with id "*" max ~2 months, because it also hides advisories that appear later).
# Fields: id (CVE, GHSA or Go advisory; "*" needs scope and package) · scope (part of the SBOM name) · package (name,
# or a prefix with one trailing "*") · reason (at least 20 characters, no hash sign) · expires (YYYY-MM-DD).
#
# State after the image bump of 2026-10-24: Prometheus v3.15.1, Loki 3.7.9 and Alloy v1.21.2 pass the gate without any
# entry. Everything below is id-specific (no package-wide waiver is left) and only covers what the newest upstream build
# still carries; the per-image counts are in docs/versions.md. Entries were generated from the Grype reports of the pinned
# digests, one per advisory and package; a new advisory therefore turns the gate red instead of being hidden.
entries:
  # --- Known and accepted by design --------------------------------------------------------------------------------
  - id: CVE-2025-63389
    scope: ollama
    reason: "Ollama has no server-side authentication and no upstream fix. Mitigated by the network only: compose.yaml gives Ollama no host port and puts it on the internal models network (security-rules 9)."
    expires: 2027-01-31
  - id: GHSA-f6mr-38g8-39rg
    scope: ollama
    reason: "Advisory alias of CVE-2025-63389 (missing authentication, no fix); same mitigation: internal-only models network, no host port."
    expires: 2027-01-31

  # --- pgvector 0.8.7-pg18-trixie: Debian packages (the Go stdlib of gosu follows further down) ---------------------
  - id: CVE-2026-6653
    scope: pgvector
    package: libxml2
    reason: "libxml2 in the Debian trixie base of the pgvector image, no Debian fix at scan time. No SQL migration in this repository uses XML types or functions, and the database is reachable only from the internal db network."
    expires: 2026-12-15
  - id: CVE-2026-103111
    scope: pgvector
    package: libpcre2-8-0
    reason: "libpcre2 in the Debian trixie base of the pgvector image; used by system tools in the image; PostgreSQL itself uses its own regular-expression engine. Rebuild of the upstream image picks up the Debian fix."
    expires: 2026-12-15

  # --- Keycloak 26.8.1 --------------------------------------------------------------------------------------------
  - id: CVE-2026-114406
    scope: keycloak
    package: ca-certificates
    reason: "Red Hat rates it CVSS 6.8 (grype shows Critical): weak intermediate CAs under eMudhra roots need a man-in-the-middle on an outbound TLS connection. The realm under deploy/keycloak/realm configures no identity-provider brokering and no SMTP server, so Keycloak starts no outbound TLS connection to the internet. No fixed ca-certificates package yet."
    expires: 2027-01-31
  - id: CVE-2026-91403
    scope: keycloak
    package: java-21-openjdk-headless
    reason: "Same eMudhra weak-intermediate-CA advisory as CVE-2026-114406, now filed against the OpenJDK CA store of the Keycloak base (Red Hat: not fixed, Grype shows Critical). Exploitation needs a man-in-the-middle on an outbound TLS connection; the realm under deploy/keycloak/realm configures no identity-provider brokering and no SMTP server, so Keycloak makes no outbound TLS connection to the internet. 26.8.1 is the newest Keycloak release and its digest is unchanged (quay.io 2026-10-24)."
    expires: 2026-12-15

  # --- nginx 1.30.6-alpine -------------------------------------------------------------------------------------------
  - id: CVE-2026-85091
    scope: nginxinc-nginx
    package: zlib
    reason: "zlib in the Alpine base of the edge proxy. No gzip directive is configured under deploy/ (nginx does not run zlib on traffic unless compression is switched on), and the proxy only forwards to verso-app. A fixed zlib arrives with the next Alpine rebuild; the digest refresh picks it up."
    expires: 2026-12-15
  - id: CVE-2026-111497
    scope: nginxinc-nginx
    package: brotli-libs
    reason: "brotli-libs in the Alpine base of the edge proxy; the fix (1.2.1-r0) was first observed in Alpine on 2026-10-24 and is not yet in any nginx-unprivileged 1.30.6 build (digest unchanged, Docker Hub). No brotli module is loaded or configured under deploy/, so nginx never runs brotli on traffic; the proxy only forwards to verso-app and Grafana. The next digest refresh picks up the fix."
    expires: 2026-12-15

