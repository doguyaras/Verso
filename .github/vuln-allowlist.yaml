    scope: ollama
    package: github.com/buger/jsonparser
    reason: "Go component (github.com/buger/jsonparser) inside the upstream Ollama 0.35.1 binary. The newest release (0.40.10) moves the model store to manifests-v2 and cannot start on the read-only model volume (docs/versions.md), so this build stays. Reachable only from verso-app over the internal models network, which has no route out."
