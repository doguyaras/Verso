# Image publish (phase 9, reference 18.1): a version tag (v*) builds the application image from that commit, tests it
# like CI, and pushes it to GitHub Container Registry as ghcr.io/<owner>/verso:<version> and :sha-<commit>, with the
# build's SBOM and provenance attestations. Nothing is pushed for branches or pull requests. Only GITHUB_TOKEN is used
# (packages: write for this job only); no third-party action besides checkout.
#
#   git tag v0.1.0 && git push origin v0.1.0
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/verso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: version from the tag (v1.2.3 → 1.2.3)
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a semantic version: $GITHUB_REF_NAME" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - name: build (the Dockerfile runs the full Maven verify in its build stage)
        run: |
          docker buildx create --use --name verso-release
          docker buildx build --load \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${{ steps.version.outputs.version }}" \
            -t "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}" \
            -t "${{ steps.version.outputs.image }}:sha-${GITHUB_SHA::12}" .
      - name: the image runs as a non-root user and starts
        run: |
          user="$(docker image inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}" --format '{{.Config.User}}')"
          [[ "$user" =~ ^[1-9][0-9]*$ ]] || { echo "image user is '$user'" >&2; exit 1; }
      - name: push with SBOM and provenance
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --push --sbom=true --provenance=mode=max \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${{ steps.version.outputs.version }}" \
            -t "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}" \
            -t "${{ steps.version.outputs.image }}:sha-${GITHUB_SHA::12}" .
          docker logout ghcr.io
