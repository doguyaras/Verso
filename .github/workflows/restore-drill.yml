# Restore drill (reference 10.5: "test edilmemiş yedek, yedek değildir"; ADR-0009). Builds the image, starts the
# compose stack from a clean checkout, writes data, takes an encrypted backup and restores it into a throwaway
# PostgreSQL: row counts, grants and Flyway validate must match. Since phase 3 it also proves the identity chain on
# the same stack (scripts/auth-smoke.sh, ADR-0010) and, since phase 4, ingestion with the real model
# (scripts/ingest-smoke.sh, ADR-0011). The self-test also proves the drill fails on a
# changed manifest, a corrupted file and a missing checksum. Weekly, on demand, and on PRs touching what it covers.
name: restore-drill
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - compose.yaml
      - Dockerfile
      - .dockerignore
      - 'deploy/**'
      - 'scripts/dev-secrets.sh'
      - 'scripts/restore-drill*.sh'
      - 'scripts/auth-smoke.sh'
      - 'scripts/ingest-smoke.sh'
      - 'scripts/qa-smoke.sh'
      - 'scripts/fixtures/**'
      - 'services/**'
      # Application config, code and build: the stack must still start from them (phase 2 environment review E4).
      - 'verso-app/**'
      - 'platform/**'
      - 'pom.xml'
      - '.mvn/**'
      - .env.example
      - '.github/workflows/restore-drill.yml'
permissions:
  contents: read
# CI exercises the pipeline, not answer quality (the eval set does, phase 8): a tiny chat model keeps the download small.
env:
  VERSO_CHAT_MODEL: qwen3:0.6b
  VERSO_CHAT_MODEL_DIGEST: sha256:7f4030143c1c477224c5434f8272c662a8b042079a0a584f0a27a1684fe2e1fa
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  drill:
    runs-on: ubuntu-latest
    # Phase 4: the Ollama image (~3.8 GB) and the bge-m3 model (1.2 GB) are downloaded on every run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: secrets (random, this run only) + stack with the observability profile (image built from this checkout)
        run: |
          bash scripts/dev-secrets.sh
          docker compose --profile obs up --detach --build --wait
      - name: identity smoke (ES256 at+jwt from the bundled Keycloak; API refuses no token and a tampered one)
        run: bash scripts/auth-smoke.sh
      - name: ingestion smoke (upload → worker with the real Ollama bge-m3 → READY, PDF dropped, 1024-d vectors → delete)
        run: bash scripts/ingest-smoke.sh
      - name: question-answering smoke (real embedding and chat model; citations point at the upload; unrelated → not found)
        run: bash scripts/qa-smoke.sh
      - name: local mode proof (app and model server on internal networks only; no route, no DNS out; X-Rag-Mode local)
        run: bash scripts/prove-local-mode.sh
      - name: observability smoke (Prometheus scrapes the app, 5 alert rules, Alertmanager, Grafana datasources and dashboard; Loki has the app's logs and none of the questions)
        run: bash scripts/obs-smoke.sh
      - name: backup + restore drill self-test (passes on real data, fails on every tampering)
        run: bash scripts/restore-drill-selftest.sh
      - name: drill on the newest backup (what the weekly run is for)
        run: |
          docker compose run --rm --no-deps -T backup once
          bash scripts/restore-drill.sh
      - name: container status and app logs on failure (logs carry ids and timings only)
        if: failure()
        run: |
          docker compose --profile obs ps
          docker compose --profile obs logs --no-color --tail 200 verso-app backup postgres keycloak ollama-pull ollama edge prometheus loki alloy grafana
      - name: teardown
        if: always()
        run: docker compose --profile drill --profile obs down --volumes --remove-orphans
